name: Build SSS 1 Mathematics Play Store AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Create package.json
        run: |
          cat > package.json <<'EOF'
          {
            "name": "sss1-mathematics-app",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^7.4.3",
              "@capacitor/android": "^7.4.3",
              "@capacitor/cli": "^7.4.3"
            }
          }
          EOF

      - name: Create Capacitor configuration
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.sss1mathematics.app",
            "appName": "SSS 1 Mathematics App",
            "webDir": "."
          }
          EOF

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web app
        run: npx cap sync android

      - name: Build Play Store AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleDebug

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: SSS-1-Mathematics-PlayStore-AAB
          path: android/app/build/outputs/bundle/debug/app-debug.aab
