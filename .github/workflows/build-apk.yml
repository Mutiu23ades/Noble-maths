name: Build SSS 1 Mathematics APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Check web app files
        run: |
          test -f index.html
          test -f script.js
          test -f style.css
          echo "All SSS 1 Mathematics web files found."

      - name: Create Android project
        run: |
          mkdir -p android/app/src/main/java/com/sss1mathematics/app
          mkdir -p android/app/src/main/res/layout
          mkdir -p android/app/src/main/res/values
          mkdir -p android/app/src/main/assets

          cp index.html android/app/src/main/assets/
          cp script.js android/app/src/main/assets/
          cp style.css android/app/src/main/assets/

      - name: Create Gradle settings
        run: |
          cat > android/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "SSS1Mathematics"
          include(":app")
          EOF

      - name: Create root Gradle file
        run: |
          cat > android/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

      - name: Create app Gradle file
        run: |
          cat > android/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.sss1mathematics.app'
              compileSdk 36

              defaultConfig {
                  applicationId 'com.sss1mathematics.app'
                  minSdk 23
                  targetSdk 36
                  versionCode 1
                  versionName '1.0'
              }
          }

          dependencies {
              implementation 'com.google.android.gms:play-services-ads:25.5.0'
          }
          EOF

      - name: Create AndroidManifest
        run: |
          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:label="SSS 1 Mathematics App"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <!-- AdMob App ID -->
                  <meta-data
                      android:name="com.google.android.gms.ads.APPLICATION_ID"
                      android:value="ca-app-pub-4792413607142824~6064767274" />

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

      - name: Create Android theme
        run: |
          cat > android/app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#1976D2</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:statusBarColor">#1976D2</item>

              </style>

          </resources>
          EOF

      - name: Create MainActivity with AdMob test banner
        run: |
          cat > android/app/src/main/java/com/sss1mathematics/app/MainActivity.java <<'EOF'
          package com.sss1mathematics.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.view.ViewGroup;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.LinearLayout;

          import com.google.android.gms.ads.AdRequest;
          import com.google.android.gms.ads.AdSize;
          import com.google.android.gms.ads.AdView;
          import com.google.android.gms.ads.MobileAds;

          public class MainActivity extends Activity {

              private WebView webView;
              private AdView adView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  MobileAds.initialize(this, initializationStatus -> {});

                  LinearLayout mainLayout = new LinearLayout(this);
                  mainLayout.setOrientation(LinearLayout.VERTICAL);

                  webView = new WebView(this);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);

                  webView.setWebViewClient(new WebViewClient());

                  LinearLayout.LayoutParams webParams =
                          new LinearLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  0,
                                  1.0f
                          );

                  mainLayout.addView(webView, webParams);

                  adView = new AdView(this);
                  adView.setAdSize(AdSize.BANNER);

                  // Google official test Banner ID.
                  // DO NOT use the real AdMob ad unit while testing.
                  adView.setAdUnitId(
                          "ca-app-pub-3940256099942544/9214589741"
                  );

                  LinearLayout.LayoutParams adParams =
                          new LinearLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  ViewGroup.LayoutParams.WRAP_CONTENT
                          );

                  mainLayout.addView(adView, adParams);

                  setContentView(mainLayout);

                  webView.loadUrl(
                          "file:///android_asset/index.html"
                  );

                  AdRequest adRequest = new AdRequest.Builder().build();
                  adView.loadAd(adRequest);
              }

              @Override
              protected void onDestroy() {
                  if (adView != null) {
                      adView.destroy();
                  }

                  if (webView != null) {
                      webView.destroy();
                  }

                  super.onDestroy();
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Build APK
        working-directory: android
        run: |
          gradle assembleDebug

      - name: Rename APK
        run: |
          mkdir -p apk

          cp android/app/build/outputs/apk/debug/app-debug.apk \
             apk/SSS-1-Mathematics-App-AdMob-Test.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SSS-1-Mathematics-App-AdMob-Test
          path: apk/SSS-1-Mathematics-App-AdMob-Test.apk
