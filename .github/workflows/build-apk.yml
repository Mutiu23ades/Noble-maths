name: Build SSS 1 Mathematics APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:

      # --------------------------------------------------
      # 1. GET THE PROJECT FILES
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. JAVA
      # --------------------------------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # --------------------------------------------------
      # 3. ANDROID SDK PATH
      # --------------------------------------------------
      - name: Configure Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"

          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"


      # --------------------------------------------------
      # 4. FIND SDKMANAGER
      # --------------------------------------------------
      - name: Locate Android SDK Manager
        shell: bash
        run: |
          echo "Searching for sdkmanager..."

          SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" \
            -type f \
            -name sdkmanager \
            | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found."
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo "Found sdkmanager:"
          echo "$SDKMANAGER"


      # --------------------------------------------------
      # 5. ACCEPT ANDROID LICENSES
      # --------------------------------------------------
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          echo "Accepting Android SDK licenses..."

          yes | "$SDKMANAGER" --licenses > /dev/null || true

          echo "Android SDK licenses processed."


      # --------------------------------------------------
      # 6. INSTALL REQUIRED ANDROID COMPONENTS
      # --------------------------------------------------
      - name: Install Android SDK components
        shell: bash
        run: |
          echo "Installing Android SDK components..."

          "$SDKMANAGER" "platform-tools"
          "$SDKMANAGER" "platforms;android-36"
          "$SDKMANAGER" "build-tools;35.0.0"

          echo "Android SDK components installed."


      # --------------------------------------------------
      # 7. CHECK MATHEMATICS APP FILES
      # --------------------------------------------------
      - name: Check application files
        shell: bash
        run: |
          echo "Checking application files..."

          test -f index.html
          test -f script.js
          test -f style.css

          echo "index.html found"
          echo "script.js found"
          echo "style.css found"

          echo "All application files are present."


      # --------------------------------------------------
      # 8. CREATE ANDROID PROJECT
      # --------------------------------------------------
      - name: Create Android project
        shell: bash
        run: |

          mkdir -p android/app/src/main/java/com/sss1mathematics/app
          mkdir -p android/app/src/main/res/values
          mkdir -p android/app/src/main/assets


          # Copy the Mathematics application
          cp index.html android/app/src/main/assets/
          cp script.js android/app/src/main/assets/
          cp style.css android/app/src/main/assets/


          # ------------------------------------------------
          # SETTINGS
          # ------------------------------------------------

          cat > android/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "SSS1Mathematics"

          include(":app")
          EOF


          # ------------------------------------------------
          # PROJECT BUILD FILE
          # ------------------------------------------------

          cat > android/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF


          # ------------------------------------------------
          # ANDROIDX / GRADLE SETTINGS
          # ------------------------------------------------

          cat > android/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m
          EOF


          # ------------------------------------------------
          # APP BUILD FILE
          # ------------------------------------------------

          cat > android/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {

              namespace 'com.sss1mathematics.app'

              compileSdk 36

              defaultConfig {

                  applicationId 'com.sss1mathematics.app'

                  minSdk 24

                  targetSdk 36

                  versionCode 1

                  versionName '1.0'
              }
          }

          dependencies {

              implementation 'com.google.android.gms:play-services-ads:25.5.0'

          }
          EOF


          # ------------------------------------------------
          # COLORS
          # ------------------------------------------------

          cat > android/app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <color name="black">#000000</color>

              <color name="white">#FFFFFF</color>

          </resources>
          EOF


          # ------------------------------------------------
          # THEME
          # ------------------------------------------------

          cat > android/app/src/main/res/values/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>

                  <item name="android:colorAccent">#1976D2</item>

                  <item name="android:statusBarColor">@color/black</item>

                  <item name="android:navigationBarColor">@color/black</item>

              </style>

          </resources>
          EOF


          # ------------------------------------------------
          # ANDROID MANIFEST
          # ------------------------------------------------

          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.INTERNET" />

              <application

                  android:allowBackup="true"

                  android:label="SSS 1 Mathematics App"

                  android:theme="@style/AppTheme">


                  <!-- AdMob App ID -->

                  <meta-data

                      android:name="com.google.android.gms.ads.APPLICATION_ID"

                      android:value="ca-app-pub-4792413607142824~6064767274" />


                  <activity

                      android:name=".MainActivity"

                      android:screenOrientation="portrait"

                      android:exported="true">


                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF


          # ------------------------------------------------
          # MAIN ACTIVITY
          # ------------------------------------------------

          cat > android/app/src/main/java/com/sss1mathematics/app/MainActivity.java <<'EOF'
          package com.sss1mathematics.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.LinearLayout;

          import com.google.android.gms.ads.AdRequest;
          import com.google.android.gms.ads.AdSize;
          import com.google.android.gms.ads.AdView;
          import com.google.android.gms.ads.MobileAds;


          public class MainActivity extends Activity {


              private WebView webView;

              private AdView adView;


              @Override

              protected void onCreate(Bundle savedInstanceState) {

                  super.onCreate(savedInstanceState);


                  // Start AdMob

                  MobileAds.initialize(
                      this,
                      initializationStatus -> {}
                  );


                  // Main vertical layout

                  LinearLayout layout =
                      new LinearLayout(this);

                  layout.setOrientation(
                      LinearLayout.VERTICAL
                  );


                  // Mathematics WebView

                  webView =
                      new WebView(this);


                  WebSettings settings =
                      webView.getSettings();


                  settings.setJavaScriptEnabled(true);

                  settings.setDomStorageEnabled(true);

                  settings.setAllowFileAccess(true);

                  settings.setAllowContentAccess(true);


                  webView.setWebViewClient(
                      new WebViewClient()
                  );


                  // Load Mathematics App

                  webView.loadUrl(
                      "file:///android_asset/index.html"
                  );


                  // WebView takes most of the screen

                  layout.addView(

                      webView,

                      new LinearLayout.LayoutParams(

                          LinearLayout.LayoutParams.MATCH_PARENT,

                          0,

                          1

                      )

                  );


                  // ----------------------------------------
                  // ADMOB BANNER
                  // ----------------------------------------

                  adView =
                      new AdView(this);


                  adView.setAdSize(
                      AdSize.BANNER
                  );


                  // Google official TEST banner

                  adView.setAdUnitId(
                      "ca-app-pub-3940256099942544/9214589741"
                  );


                  layout.addView(

                      adView,

                      new LinearLayout.LayoutParams(

                          LinearLayout.LayoutParams.MATCH_PARENT,

                          LinearLayout.LayoutParams.WRAP_CONTENT

                      )

                  );


                  // Display everything

                  setContentView(layout);


                  // Load test advertisement

                  AdRequest adRequest =
                      new AdRequest.Builder().build();


                  adView.loadAd(adRequest);

              }


              @Override

              protected void onDestroy() {

                  if (adView != null) {

                      adView.destroy();

                  }


                  if (webView != null) {

                      webView.destroy();

                  }


                  super.onDestroy();

              }

          }
          EOF


          echo "Android project created successfully."


      # --------------------------------------------------
      # 9. GRADLE
      # --------------------------------------------------
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'


      # --------------------------------------------------
      # 10. BUILD APK
      # --------------------------------------------------
      - name: Build Debug APK
        working-directory: android
        shell: bash
        run: |
          gradle assembleDebug --no-daemon


      # --------------------------------------------------
      # 11. UPLOAD APK
      # --------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SSS-1-Mathematics-App-AdMob-Test
          path: android/app/build/outputs/apk/debug/app-debug.apk
