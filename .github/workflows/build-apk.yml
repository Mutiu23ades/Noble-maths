name: Build SSS 1 Mathematics APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set Android SDK paths
        shell: bash
        run: |
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"

      - name: Check Android SDK
        shell: bash
        run: |
          ls -la "$ANDROID_SDK_ROOT"
          find "$ANDROID_SDK_ROOT/cmdline-tools" -maxdepth 2 -type f -name sdkmanager -print

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            echo "latest sdkmanager not found."
            echo "Searching for sdkmanager..."
            SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found."
            exit 1
          fi

          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true

      - name: Install Android SDK components
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)
          fi

          "$SDKMANAGER" "platform-tools"
          "$SDKMANAGER" "platforms;android-36"
          "$SDKMANAGER" "build-tools;35.0.0"

      - name: Check web files
        shell: bash
        run: |
          test -f index.html
          test -f script.js
          test -f style.css
          echo "Web files found successfully."

      - name: Create Android project
        shell: bash
        run: |
          mkdir -p android/app/src/main/java/com/sss1mathematics/app
          mkdir -p android/app/src/main/res/values
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/assets

          cp index.html android/app/src/main/assets/
          cp script.js android/app/src/main/assets/
          cp style.css android/app/src/main/assets/

          cat > android/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "SSS1Mathematics"
          include(":app")
          EOF

          cat > android/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > android/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.sss1mathematics.app'
              compileSdk 36

              defaultConfig {
                  applicationId 'com.sss1mathematics.app'
                  minSdk 23
                  targetSdk 36
                  versionCode 1
                  versionName '1.0'
              }
          }

          dependencies {
              implementation 'com.google.android.gms:play-services-ads:25.5.0'
          }
          EOF

          cat > android/app/src/main/res/values/colors.xml <<'EOF'
          <resources>
              <color name="black">#000000</color>
              <color name="white">#FFFFFF</color>
          </resources>
          EOF

          cat > android/app/src/main/res/values/themes.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#1976D2</item>
                  <item name="android:navigationBarColor">@color/black</item>
                  <item name="android:statusBarColor">@color/black</item>
              </style>
          </resources>
          EOF

          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:label="SSS 1 Mathematics App"
                  android:theme="@style/AppTheme">

                  <meta-data
                      android:name="com.google.android.gms.ads.APPLICATION_ID"
                      android:value="ca-app-pub-4792413607142824~6064767274" />

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > android/app/src/main/java/com/sss1mathematics/app/MainActivity.java <<'EOF'
          package com.sss1mathematics.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.LinearLayout;

          import com.google.android.gms.ads.AdRequest;
          import com.google.android.gms.ads.AdSize;
          import com.google.android.gms.ads.AdView;
          import com.google.android.gms.ads.MobileAds;

          public class MainActivity extends Activity {

              private WebView webView;
              private AdView adView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  MobileAds.initialize(this, initializationStatus -> {});

                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);

                  webView = new WebView(this);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);

                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("file:///android_asset/index.html");

                  layout.addView(
                      webView,
                      new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          0,
                          1
                      )
                  );

                  adView = new AdView(this);
                  adView.setAdSize(AdSize.BANNER);

                  // Google official test banner ID
                  adView.setAdUnitId("ca-app-pub-3940256099942544/9214589741");

                  layout.addView(
                      adView,
                      new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      )
                  );

                  setContentView(layout);

                  AdRequest adRequest = new AdRequest.Builder().build();
                  adView.loadAd(adRequest);
              }

              @Override
              protected void onDestroy() {
                  if (adView != null) {
                      adView.destroy();
                  }

                  if (webView != null) {
                      webView.destroy();
                  }

                  super.onDestroy();
              }
          }
          EOF

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: android
        run: |
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SSS-1-Mathematics-App-AdMob-Test
          path: android/app/build/outputs/apk/debug/app-debug.apk
